# ==============================================================================
# Butter AI Proxy Gateway - Reference Configuration
# ==============================================================================
# In this schema:
#   1. Providers define upstream API endpoints and authentication credentials.
#   2. Models are mapped under 'routing.models':
#      - Pattern A: Namespaced routes ('<provider>/<model_id>') for explicit
#        downstream selection (Butter transparently rewrites 'model' upstream).
#      - Pattern B: Shared virtual models ('deepseek-chat') with multi-provider
#        failover ('providers: [deepinfra, openrouter]').
#   3. Curated metadata ('label', 'family') is broadcast via GET /v1/models and
#      GET /api/models for clean client UI display.
#   4. 'extra_body' allows injecting arbitrary upstream JSON parameters
#      (e.g., OpenRouter Zero Data Retention: {provider: {zdr: true}}).
# ==============================================================================

server:
  address: "127.0.0.1:8080"
  read_timeout: 30s
  write_timeout: 120s
  read_header_timeout: 10s
  idle_timeout: 120s
  max_header_bytes: 1048576
  max_request_bytes: 33554432

providers:
  # --- Cloud Aggregators & Inference Gateways ---
  openrouter:
    base_url: https://openrouter.ai/api/v1
    credential_mode: passthrough
    keys:
      - key: "${OPENROUTER_API_KEY}"
        weight: 1

  deepinfra:
    base_url: https://api.deepinfra.com/v1/openai
    keys:
      - key: "${DEEPINFRA_API_KEY}"
        weight: 1

  onemin:
    base_url: https://api.1min.ai/openai/v1
    keys:
      - key: "${ONEMIN_AI_API_KEY}"
        weight: 1

  # --- Local & LAN Inference Nodes ---
  ollama:
    base_url: http://127.0.0.1:11434/v1
    keys:
      - key: ollama
        weight: 1

  vllm-local:
    base_url: http://127.0.0.1:8000/v1
    keys:
      - key: none
        weight: 1

routing:
  default_provider: openrouter

  failover:
    enabled: true
    max_retries: 2
    backoff:
      initial: 100ms
      multiplier: 2.0
      max: 2s
    retry_on: [429, 500, 502, 503, 504]

  models:
    # ==========================================================================
    # PATTERN 1: Explicit Provider Namespacing (<provider>/<upstream_model>)
    # Client requests 'onemin/gpt-4o-mini' -> Butter rewrites model to 'gpt-4o-mini'
    # ==========================================================================

    # --- 1min.AI Gateway Routes ---
    "onemin/gpt-4o-mini":
      provider: onemin
      model: gpt-4o-mini
      label: "GPT-4o Mini (1min.AI)"
      family: openai
      strategy: priority

    "onemin/claude-3-5-sonnet":
      provider: onemin
      model: claude-3-5-sonnet
      label: "Claude 3.5 Sonnet (1min.AI)"
      family: claude
      strategy: priority

    "onemin/qwen3.7-flash":
      provider: onemin
      model: qwen3.7-flash
      label: "Qwen 3.7 Flash (1min.AI)"
      family: qwen
      strategy: priority

    # --- DeepInfra Direct Routes ---
    "deepinfra/deepseek-ai/DeepSeek-V3":
      provider: deepinfra
      model: deepseek-ai/DeepSeek-V3
      label: "DeepSeek V3 (DeepInfra)"
      family: deepseek
      strategy: priority

    "deepinfra/Qwen/Qwen2.5-72B-Instruct":
      provider: deepinfra
      model: Qwen/Qwen2.5-72B-Instruct
      label: "Qwen 2.5 72B Instruct (DeepInfra)"
      family: qwen
      strategy: priority

    # --- OpenRouter Cloud Routes (with Zero Data Retention extra_body) ---
    "openrouter/nousresearch/hermes-3-llama-3.1-405b":
      provider: openrouter
      model: nousresearch/hermes-3-llama-3.1-405b
      label: "Hermes 3 405B (ZDR Restricted)"
      family: llama
      strategy: priority
      extra_body:
        provider:
          zdr: true
          data_collection: "deny"
          require_parameters: false

    "openrouter/anthropic/claude-3.5-sonnet":
      provider: openrouter
      model: anthropic/claude-3.5-sonnet
      label: "Claude 3.5 Sonnet (OpenRouter)"
      family: claude
      strategy: priority

    # --- Local Inference Routes (Ollama / vLLM) ---
    "ollama/llama3.2:3b":
      provider: ollama
      model: llama3.2:3b
      label: "Llama 3.2 3B (Local Ollama)"
      family: llama
      strategy: priority

    "ollama/qwen2.5-coder:32b":
      provider: ollama
      model: qwen2.5-coder:32b
      label: "Qwen 2.5 Coder 32B (Local Ollama)"
      family: qwen
      strategy: priority

    "vllm-local/meta-llama/Llama-3.3-70B-Instruct":
      provider: vllm-local
      model: meta-llama/Llama-3.3-70B-Instruct
      label: "Llama 3.3 70B Instruct (Local vLLM)"
      family: llama
      strategy: priority

    # ==========================================================================
    # PATTERN 2: Shared Virtual Model with Multi-Provider Failover
    # Downstream clients request generic model ID 'deepseek-chat'.
    # Butter attempts deepinfra first; on 429/500 it automatically fails over
    # to openrouter, rewriting the model ID on the fly.
    # ==========================================================================
    "deepseek-chat":
      providers: [deepinfra, openrouter]
      model: deepseek-ai/DeepSeek-V3
      label: "DeepSeek V3 (Multi-Provider Failover)"
      family: deepseek
      strategy: priority
