name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest test_model_limits -v
      - name: Validate example configs
        run: |
          python butterproxy_config_manager.py validate --config config.example.yaml
          python butterproxy_config_manager.py validate --config blank_config.yaml
      - name: Generated template validates
        run: |
          python butterproxy_config_manager.py generate-template --output generated.yaml
          python butterproxy_config_manager.py validate --config generated.yaml
      - name: Syntax-check deploy script
        if: runner.os == 'Linux'
        run: bash -n deploy.sh
